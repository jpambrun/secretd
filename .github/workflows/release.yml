name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: secretd-linux-x86_64
          - os: macos-latest
            asset: secretd-macos

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwayland-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build Linux archive
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release --bin secretd
          mkdir -p staging
          cp target/release/secretd README.md LICENSE staging/
          tar -C staging -czf secretd-linux-x86_64.tar.gz secretd README.md LICENSE

      - name: Build macOS archive
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --bin secretd
          mkdir -p staging/secretd-macos
          cp target/release/secretd README.md LICENSE staging/secretd-macos/
          tar -C staging -czf secretd-macos.tar.gz secretd-macos

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: secretd-*
          merge-multiple: true

      - name: Create release and upload archives
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --generate-notes \
              --title "secretd $RELEASE_TAG" \
              --verify-tag
          fi
